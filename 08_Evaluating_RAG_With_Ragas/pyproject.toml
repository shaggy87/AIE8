[project]
name = "08-evaluating-rag-with-ragas"
version = "0.1.0"
description = "Advanced Build: Semantic Chunking RAG Evaluation with RAGAS"
readme = "README.md"
requires-python = "==3.13"
dependencies = [
    # LangChain Core
    "langchain>=0.3.14",
    "langchain-community>=0.3.29",
    "langchain-openai>=0.3.33",
    "langchain-qdrant>=0.2.1",
    "langgraph>=0.6.7",

    # RAGAS for evaluation
    "ragas==0.2.10",
    "rapidfuzz>=3.0.0",

    # Vector stores
    "qdrant-client>=1.7.0",

    # Document processing
    "pymupdf>=1.24.0",

    # Semantic chunking dependencies
    "scikit-learn>=1.0.0",
    "numpy>=1.21.0",

    # Jupyter notebook support
    "jupyter>=1.1.1",
    "ipykernel>=6.30.1",
    "ipywidgets>=8.0.0",

    # Optional: Cohere for reranking (not used in Advanced Build)
    "langchain-cohere==0.4.4",
    "cohere>=5.12.0,<5.13.0",
    "pyppeteer>=2.0.0",
]